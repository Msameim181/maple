# Maple look for Keycloak's emails (verify email, password reset, required actions, email change).
# Base templates stay Keycloak's; only the layout and the wording change.
parent=base
# Mail clients block relative and data: images, so the logo must be an ABSOLUTE https URL that the
# recipient's mail client can reach. Set it to the public app URL, for example
#   logoUrl=https://maple.example.com/logo192.png
# (the PNG ships in the web app's public folder). Empty shows the name as text instead.
logoUrl=
