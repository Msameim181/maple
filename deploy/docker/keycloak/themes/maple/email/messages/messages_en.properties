# Keycloak passes no arguments to email subjects, so subjects must not use {n} placeholders.
# Plainer wording for Keycloak's emails. {0} is the link, {2} the realm display name.
emailVerificationSubject=Confirm your email
emailVerificationBody=Confirm your email address for {2} by opening this link:\n\n{0}\n\nThe link works for {3}. If you did not sign up, ignore this email.
emailVerificationBodyHtml=<p>Confirm your email address for <b>{2}</b>.</p><p><a href="{0}" style="color:#e8872a;">Confirm my email</a></p><p>The link works for {3}. If you did not sign up, ignore this email.</p>
passwordResetSubject=Reset your password
passwordResetBody=Someone asked to reset your {2} password. Choose a new one here:\n\n{0}\n\nThe link works for {3}. If this was not you, ignore this email and your password stays the same.
passwordResetBodyHtml=<p>Someone asked to reset your <b>{2}</b> password.</p><p><a href="{0}" style="color:#e8872a;">Choose a new password</a></p><p>The link works for {3}. If this was not you, ignore this email and your password stays the same.</p>
executeActionsSubject=Finish setting up your account
executeActionsBody=Your administrator asked you to do the following for your {2} account: {3}.\n\nOpen this link to continue:\n\n{0}\n\nThe link works for {4}. If you did not expect this, ignore this email.
executeActionsBodyHtml=<p>Your administrator asked you to do the following for your <b>{2}</b> account: {3}.</p><p><a href="{0}" style="color:#e8872a;">Continue</a></p><p>The link works for {4}. If you did not expect this, ignore this email.</p>
emailUpdateConfirmationSubject=Confirm your new email
emailUpdateConfirmationBody=Confirm {3} as the email for your {2} account:\n\n{0}\n\nThe link works for {4}. If you did not ask for this, ignore this email.
emailUpdateConfirmationBodyHtml=<p>Confirm <b>{3}</b> as the email for your <b>{2}</b> account.</p><p><a href="{0}" style="color:#e8872a;">Confirm new email</a></p><p>The link works for {4}. If you did not ask for this, ignore this email.</p>
