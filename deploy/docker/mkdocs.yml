# GitHub Pages site for multi-tenant self-hosting. The Markdown is the same folder the Maple docs site
# builds, so there is one source. Build with scripts/build-docs.sh, which rewrites /docs/... links.
site_name: Maple multi-tenant self-hosting
site_description: Run Maple for many organizations on one server with Docker and Keycloak.
site_url: https://msameim181.github.io/maple/
repo_url: https://github.com/Msameim181/maple
docs_dir: ../../apps/landing/src/content/docs/self-hosting/multi-tenant
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
markdown_extensions:
  - tables
  - toc:
      permalink: true
nav:
  - Overview: index.md
  - Auth service options: auth-options.md
  - Install: install.md
  - Configuration: configuration.md
  - How authentication works: how-auth-works.md
  - Operations: operations.md
  - Status pages and uptime: status-and-uptime.md
  - Security: security.md
  - Troubleshooting: troubleshooting.md
validation:
  anchors: warn
  links:
    not_found: warn
