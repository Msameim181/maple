name: Self-host docs

# Publishes the Maple docs site (the Astro app in apps/landing) to GitHub Pages for this fork, under
# https://<owner>.github.io/<repo>/. Same content as maple.dev/docs. Needs Settings -> Pages ->
# Source: "GitHub Actions", and `selfhost` allowed in the github-pages environment's branches.
on:
  push:
    branches: [selfhost]
    paths:
      - "apps/landing/**"
      - "scripts/install.sh"
      - "scripts/uninstall.sh"
      - ".github/workflows/selfhost-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: selfhost-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in sync with packageManager in package.json
      - run: bun install --frozen-lockfile
      # The landing app imports the browser SDK from its built output; the other workspace
      # packages it uses are consumed from source.
      - run: bunx turbo build --filter=@maple-dev/browser
      - name: Build the site for the Pages sub-path
        working-directory: apps/landing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          export ASTRO_SITE="https://${owner}.github.io"
          export ASTRO_BASE="/${{ github.event.repository.name }}"
          bun --bun run build
          # Hand-written links in Markdown and a few scripts are root-relative; prefix them.
          node scripts/pages-base.mjs dist "$ASTRO_BASE"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
